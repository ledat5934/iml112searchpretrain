pipeline_timeout: 28800
per_execution_timeout: 28800

# Data Perception
max_file_group_size_to_show: 5
num_example_files_to_show: 1

max_chars_per_file: 1024
num_tutorial_retrievals: 30
max_num_tutorials: 5
max_user_input_length: 2048
max_error_message_length: 2048
max_error_lines_for_llm: 20  # Maximum lines of error message to send to LLM for debugging
max_tutorial_length: 32768
create_venv: false
condense_tutorials: True
use_tutorial_summary: True

# Debug
verbosity: 2

# Search mode:
# - hybrid: use external retrieval/search tools (ADK) when available
# - llm_only: disable external search entirely; rely on LLM-only generation
search_mode: hybrid

# Default LLM Configuration
llm: &default_llm
  provider: gemini
  model: gemini-3.1-flash-lite-preview
  fallback_model: gemini-2.5-flash
  max_tokens: 16384
  proxy_url: null
  temperature: 0.0
  top_p: 0.9
  verbose: True
  multi_turn: False
  template: null
  add_coding_format_instruction: false

description_analyzer:
  <<: *default_llm

profiling_summarizer:
  <<: *default_llm

task_schema_agent:
  <<: *default_llm

knowledge_retriever:
  <<: *default_llm

guideline_generator:
  <<: *default_llm

preprocessing_coder:
  <<: *default_llm

modeling_coder:
  <<: *default_llm

monolithic_coder:
  <<: *default_llm

assembler:
  <<: *default_llm

# Optional: research phase
# - planner proposes exactly 3 different improvements
# - each candidate runs a proxy evaluation with 5-minute training budget
# - candidates are ranked by printed proxy metric
# - top-1 is rerun in full mode
research_phase:
  enabled: true
  max_iterations: 1
  diagnosis_enabled: true
  diagnosis_max_rounds: 3
  ablation_enabled: true
  ablation_n_candidates: 3
  ablation_proxy_time_budget_sec: 1200
  ablation_proxy_exec_timeout_sec: 1500
  n_candidates: 3
  proxy_time_budget_sec: 300
  # Allow a bit more than proxy budget so the script can soft-stop and exit cleanly.
  proxy_exec_timeout_sec: 330
  top_k_full: 1
  termination_grace_sec: 2

# LLM config for research phase (defaults to assembler if omitted)
research_phase_llm:
  <<: *default_llm
