[project]
name = "iml-automl"
version = "0.1.0"
description = "Intelligent Machine Learning AutoML framework"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "python-dotenv>=1.1,<2",
    "setuptools>=69,<82",
    "wrapt>=1.16,<3",
    "omegaconf>=2.3,<3",
    "pandas>=2.2,<3",
    "rich",
    "tqdm>=4.67,<5",
    "pydantic>=2.11,<3",
    "tenacity>=9.1,<10",
    "langchain>=0.3.27,<0.4",
    "langchain-community>=0.3.27,<0.4",
    "langchain-core>=0.3.72,<0.4",
    "langgraph==0.2.73",
    "langgraph-checkpoint==2.0.21",
    "langgraph-prebuilt==0.2.3",
    "ydata-profiling",
    "google-adk",
    "google-genai",
    "google-generativeai>=0.8.5,<0.9",
    "anthropic",
    "langchain-anthropic==0.3.6",
    "langchain-aws==0.2.9",
    "langchain-google-genai==2.0.9",
    "langchain-openai==0.3.16",
]

[project.optional-dependencies]
openai = [
    "openai>=1.99.1,<2",
]
anthropic = [
    "anthropic",
]
bedrock = [
    "boto3>=1.40.3,<2",
]
ml = [
    "numpy>=1.26,<2.2",
    "scipy>=1.13.1,<2",
    "scikit-learn>=1.6.1,<2",
    "xgboost>=3.0.3,<4",
    "lightgbm>=4.6.0,<5",
    "catboost>=1.2.8,<2",
    "torch>=2.7.1,<3",
    "torchvision>=0.22.1,<0.23",
    "transformers>=4.41,<5",
    "datasets>=4,<5",
    "accelerate>=1.9,<2",
    "sentence-transformers>=5,<6",
]
all-providers = [
    "openai>=1.99.1,<2",
    "anthropic",
    "boto3>=1.40.3,<2",
]
full = [
    "openai>=1.99.1,<2",
    "anthropic",
    "boto3>=1.40.3,<2",
    "numpy>=1.26,<2.2",
    "scipy>=1.13.1,<2",
    "scikit-learn>=1.6.1,<2",
    "xgboost>=3.0.3,<4",
    "lightgbm>=4.6.0,<5",
    "catboost>=1.2.8,<2",
    "torch>=2.7.1,<3",
    "torchvision>=0.22.1,<0.23",
    "transformers>=4.41,<5",
    "datasets>=4,<5",
    "accelerate>=1.9,<2",
    "sentence-transformers>=5,<6",
]

[tool.uv]
package = false
